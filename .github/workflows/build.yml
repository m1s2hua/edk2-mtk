name: build-uefi

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform dir under Platform/ (e.g. Xiaomi/emeraldPkg)'
        required: true
        default: 'Xiaomi/emeraldPkg'
      target:
        description: 'Build target'
        required: true
        default: 'RELEASE'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential uuid-dev iasl nasm acpica-tools \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            clang lld llvm \
            python3 python3-pip python3-venv git
          python3 -m pip install --upgrade pip
          python3 -m pip install edk2-pytool-library edk2-pytool-extensions

      - name: Toolchain versions
        run: |
          aarch64-linux-gnu-gcc --version | head -1
          clang --version | head -1
          llvm-ar --version | head -1
          ld.lld --version | head -1
          python3 --version
          iasl -v | head -2

      - name: Provide mkbootimg shim
        run: |
          sudo tee /usr/local/bin/mkbootimg >/dev/null <<'PYEOF'
          #!/usr/bin/env python3
          import argparse, struct
          ap = argparse.ArgumentParser()
          ap.add_argument('--header_version', default='4')
          ap.add_argument('--kernel', required=True)
          ap.add_argument('--ramdisk', default=None)
          ap.add_argument('--output', required=True)
          ap.add_argument('--cmdline', default='')
          a = ap.parse_args()
          kernel = open(a.kernel, 'rb').read()
          ramdisk = open(a.ramdisk, 'rb').read() if a.ramdisk else b''
          PAGE = 4096
          def align(x): return (x + PAGE - 1) // PAGE * PAGE
          hdr = bytearray(PAGE)
          hdr[0:8] = b'ANDROID!'
          struct.pack_into('<I', hdr, 8, len(kernel))
          struct.pack_into('<I', hdr, 12, len(ramdisk))
          struct.pack_into('<I', hdr, 16, 0x1800017b)
          struct.pack_into('<I', hdr, 20, 1584)
          struct.pack_into('<I', hdr, 40, int(a.header_version))
          if a.cmdline:
              cb = a.cmdline.encode()
              hdr[44:44+len(cb)] = cb
          out = bytearray(hdr) + kernel
          out += b'\0' * (align(len(out)) - len(out))
          out += ramdisk
          out += b'\0' * (align(len(out)) - len(out))
          open(a.output, 'wb').write(out)
          PYEOF
          sudo chmod +x /usr/local/bin/mkbootimg
          mkbootimg --help 2>&1 | head -3 || true

      - name: Setup platform
        run: ./build.sh -s -t "${{ inputs.target }}" "${{ inputs.platform }}"

      - name: Build BaseTools (host toolchain, no shim)
        run: make -C Common/edk2/BaseTools

      - name: Build platform
        run: |
          # EDK2 CLANG38 的 AARCH64 目标调用裸 objcopy/strip，需让 PATH 里的
          # 名字解析到 aarch64 版本，否则报 "architecture aarch64 unknown"
          mkdir -p "$HOME/tcshim"
          for t in objcopy strip nm readelf ar ld; do
            printf '#!/bin/sh\nexec /usr/bin/aarch64-linux-gnu-%s "$@"\n' "$t" > "$HOME/tcshim/$t"
            chmod +x "$HOME/tcshim/$t"
          done
          export PATH="$HOME/tcshim:$PATH"
          echo "objcopy -> $(command -v objcopy)"
          objcopy --version | head -1
          python3 "Platform/${{ inputs.platform }}/PlatformBuild.py" "TARGET=${{ inputs.target }}"

      - name: Collect artifacts
        if: always()
        run: |
          echo "--- tree of Build ---"
          find Build -maxdepth 3 -type d 2>/dev/null | head -50 || true
          echo "--- fd / img / bin ---"
          find . -path ./Common -prune -o -type f \( -name "*.fd" -o -name "*.img" -o -name "*.bin" \) -print 2>/dev/null | head -50 || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uefi-build-${{ github.run_number }}
          path: |
            Build/**/*.fd
            Build/**/*.img
            Build/**/*.bin
            **/*.fd
            Build/BUILDLOG_*.txt
          if-no-files-found: warn
          retention-days: 14
